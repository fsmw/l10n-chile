[checklog-odoo]
ignore=
    WARNING.* 0 failed, 0 error\(s\).*
    # Odoo 18's bundled mail README is parsed as reStructuredText and emits this known pair.
    (?s).*<string>:38: \(ERROR/3\) Unexpected indentation\..*<string>:43: \(WARNING/2\) Block quote ends without a blank line; unexpected unindent\.
