services:
  postgres:
    image: postgres:12.0
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 5s
      timeout: 5s
      retries: 12

  test-odoo:
    image: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
    init: true
    profiles: ["odoo"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /mnt/oca-addons
    volumes:
      - .:/mnt/oca-addons
    environment: &oca-ci-env
      ADDONS_DIR: /mnt/oca-addons
      PGHOST: postgres
      PGUSER: odoo
      PGPASSWORD: odoo
      PGDATABASE: odoo
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    command: ["/bin/bash", "./scripts/oca-ci-in-container.sh"]

  test-ocb:
    image: ghcr.io/oca/oca-ci/py3.10-ocb18.0:latest
    init: true
    profiles: ["ocb"]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /mnt/oca-addons
    volumes:
      - .:/mnt/oca-addons
    environment: *oca-ci-env
    command: ["/bin/bash", "./scripts/oca-ci-in-container.sh"]
